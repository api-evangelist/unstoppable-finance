aid: unstoppable-finance
name: Unstoppable Finance (Iron)
description: Unstoppable Finance is the Berlin fintech behind Iron (iron.xyz), the Stablecoin Payment
  Network - fiat-to-stablecoin and stablecoin-to-fiat infrastructure for businesses. Founded as Unstoppable
  Finance GmbH and builder of the Ultimate self-custodial DeFi wallet, the company rebranded to Iron and
  was acquired by MoonPay in 2025. The Iron API provides onramp, offramp, and swap flows via Autoramps
  (standing fiat/crypto conversion rules), customer onboarding with tiered KYC/KYB, Travel Rule wallet
  verification, virtual accounts, fee profiles, exchange rates, stablecoin issuance, and Standard Webhooks
  event delivery, with a fully simulated sandbox environment.
