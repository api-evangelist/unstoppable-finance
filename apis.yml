apis:
- aid: unstoppable-finance:unstoppable-finance-addresses-api
  name: Unstoppable Finance (Iron) Addresses API
  description: >-
    Wallet and bank account registration


    Every wallet address that interacts with Iron must be registered (linked) to a customer **before**
    it can be used in any flow — onramp, offramp, or swap. This is a regulatory requirement under the
    **Travel Rule**, which obliges Virtual Asset Service Providers to exchange originator and beneficiary
    information for crypto transfers.


    Iron supports two wallet types:


    - **Self-hosted wallets** — the customer controls the private key. Registration requires a signed
    proof-of-ownership message.

    - **Hosted wallets** — the wallet is custodied by another VASP (e.g. Coinbase, Kraken). Registration
    requires the VASP's DID so Iron can exchange travel-rule data with the custodian.


    Similarly, fiat bank accounts must be registered before they can receive offramp payouts.
  humanURL: https://docs.iron.xyz/overview
  baseURL: https://api.iron.xyz/api
  tags:
  - Addresses
  properties:
  - type: OpenAPI
    url: openapi/unstoppable-finance-addresses-api-openapi.yml
  - type: Documentation
    url: https://docs.iron.xyz/overview
  - type: APIReference
    url: >-
      https://docs.iron.xyz/reference-sandbox/addresses/register-a-self-attested-wallet-address
