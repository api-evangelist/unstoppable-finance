      properties:
        counterparts:
          description: |-
            Valid mint/redeem counterpart currencies (the other side of the pair).
            Populated only for mint-only brand tokens (PYUSDx, M0 extensions); empty
            for every other currency. Mint and redeem are symmetric — same set.
          items:
            $ref: '#/components/schemas/Currency'
          type: array
        currency:
          $ref: '#/components/schemas/Currency'
        flows:
          description: The flows available for this currency.
          items:
