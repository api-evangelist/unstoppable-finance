    SignedAutorampQuote:
      description: |
        Signed Autoramp Quote

        The signed autoramp quote
      properties:
        ach_payment_reference:
          description: a message to include in outgoing ACH transfers (max 10 characters)
          maxLength: 10
          minLength: 1
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
        additional_in_currencies:
          description: |-
            Additional input currencies to allow on the autoramp beyond `source_currency`.

            Each entry must share the same chain as `source_currency` and the list must
            not include `source_currency` itself. After autoramp creation, further quotes
            can be obtained for these currencies via `POST /autoramps/:id/quotes`.
          items:
            $ref: '#/components/schemas/Currency'
          type: array
        amount_in:
          $ref: '#/components/schemas/Amount'
        amount_out:
          $ref: '#/components/schemas/Amount'
        batch_payout:
          description: |-
            If true, payouts for this autoramp will be batched and sent once per day instead of individually.
            Only supported for fiat destination currencies.
          type: boolean
        customer_id:
          description: The customer id
          format: uuid
          type: string
        deposit_account_type:
          $ref: '#/components/schemas/DepositAccountType'
        destination_currency:
          $ref: '#/components/schemas/Currency'
        external_id:
          description: The external id
          type: string
        fee:
          $ref: '#/components/schemas/Fee'
        fee_profile_id:
          description: The fee profile id to use for the autoramp. If not provided, the default fee profile for the partner will be used.
          format: uuid
          type: string
        fee_settlement:
          $ref: '#/components/schemas/FeeSettlement'
        fps_payment_reference:
          description: a message to include in outgoing FPS transfers (max 18 characters)
          maxLength: 18
          minLength: 6
          pattern: ^[A-Za-z]*$
          type: string
        is_third_party:
          description: Is this a third party autoramp
          type: boolean
        pay_by_reference:
          description: |-
            If true, a payment reference will be generated for the autoramp on
            inbound matching (pay-by-reference). Defaults to false if not provided.
          type: boolean
        quote_id:
          description: The id of the quote
          format: uuid
          type: string
        rate:
          description: The rate
          format: decimal
          type: string
        rate_expiry_policy:
          $ref: '#/components/schemas/RateExpiryPolicy'
        rate_lock_valid_until:
          description: The rate lock valid until
          format: date-time
          type: string
        recipient_account:
          $ref: '#/components/schemas/Account'
        sepa_payment_reference:
          description: a message to include in outgoing SEPA transfers (max 140 characters)
          maxLength: 140
          minLength: 6
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
        signature:
          description: The signature
          type: string
        slippage_tolerance_in_bips:
          description: The slippage tolerance in bips
          format: decimal
          type: string
        source_currency:
          $ref: '#/components/schemas/Currency'
        swift_payment_reference:
          description: a message to include in outgoing SWIFT transfers (max 4 lines, 35 chars per line)
          maxLength: 140
          minLength: 1
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
        valid_until:
          description: The valid until
          format: date-time
          type: string
        wire_message:
          description: a message to include in outgoing wire transfers (max 4 lines, 35 chars per line)
          maxLength: 140
          minLength: 1
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
      required:
      - quote_id
      - source_currency
      - destination_currency
      - recipient_account
      - customer_id
      - amount_in
      - amount_out
      - rate
      - rate_expiry_policy
      - fee
      - fee_settlement
      - valid_until
      - signature
      - is_third_party
      title: SignedAutorampQuote
      type: object
    SignedAutorampRateQuote:
      description: |-
        Signed rate quote for an existing autoramp.

        Contains only pricing fields — the autoramp's currencies, recipient, etc. are already known.

        Deposits are matched to the newest active quote whose `amount_in` value and
        currency equal the deposit. Attaching a quote that overlaps an existing one
        on those fields supersedes it for new deposits; all of the newer quote's
        terms apply (rate lock, expiry policy, slippage tolerance, fees).
      properties:
        amount_in:
          $ref: '#/components/schemas/Amount'
        amount_out:
          $ref: '#/components/schemas/Amount'
        autoramp_id:
          description: The autoramp this quote is for
          format: uuid
          type: string
        destination_currency:
          $ref: '#/components/schemas/Currency'
        fee:
          $ref: '#/components/schemas/Fee'
        fee_settlement:
          $ref: '#/components/schemas/FeeSettlement'
        payment_reference:
          description: |-
            An optional payout reference used when paying out transactions matched to
            this quote. Overrides the autoramp's payment reference.
          maxLength: 140
          minLength: 1
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
        quote_id:
          description: The id of the quote
          format: uuid
          type: string
        rate:
          description: The rate
          format: decimal
          type: string
        rate_expiry_policy:
          $ref: '#/components/schemas/RateExpiryPolicy'
        rate_lock_valid_until:
          description: The rate lock valid until
          format: date-time
          type: string
        signature:
          description: The signature
          type: string
        slippage_tolerance_in_bips:
          description: The slippage tolerance in bips
          format: decimal
          type: string
        source_currency:
          $ref: '#/components/schemas/Currency'
        valid_until:
          description: The valid until
          format: date-time
          type: string
      required:
      - quote_id
      - autoramp_id
      - source_currency
      - destination_currency
      - amount_in
      - amount_out
      - rate
      - rate_lock_valid_until
      - rate_expiry_policy
      - fee
      - fee_settlement
      - valid_until
      - signature
      title: SignedAutorampRateQuote
      type: object
    Signing:
