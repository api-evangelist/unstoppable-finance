    CreateAutoramp:
      description: Either a set of market parameters or a signed quote. Optionally include a `type` field (`market` | `quote`) to get precise validation errors.
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/CreateAutorampParameters'
        - properties:
            type:
              description: Optional discriminator. When present, the body is parsed as this variant and validation errors point at the offending field instead of the whole payload.
              enum:
              - market
              type: string
          type: object
      - allOf:
        - $ref: '#/components/schemas/SignedAutorampQuote'
        - properties:
            type:
              description: Optional discriminator. When present, the body is parsed as this variant and validation errors point at the offending field instead of the whole payload.
              enum:
              - quote
              type: string
          type: object
    CreateAutorampOpenBankingPayment:
      description: |
        Create Autoramp Payment Link Payload

        The parameters for creating an autoramp payment link
      properties:
        amount_in:
          $ref: '#/components/schemas/Amount'
        callback_url:
          type: string
      required:
      - amount_in
      - callback_url
      title: CreateAutorampOpenBankingPayment
      type: object
    CreateAutorampParameters:
      description: |
        Create Autoramp Parameters

        The parameters required to create a autoramp
      properties:
        ach_payment_reference:
          description: reference message attached to outgoing ACH transfers (max 10 chars)
          maxLength: 10
          minLength: 1
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
        additional_partner_fee_in_bips:
          deprecated: true
          description: The additional partner fee in bips. This will be added to the fee. This is deprecated, use the partner fee configs instead.
          format: decimal
          type: string
        batch_payout:
          description: |-
            If true, payouts for this autoramp will be batched and sent once per day instead of individually.
            Only supported for fiat destination currencies.
          type: boolean
        customer_id:
          description: The customer id
          format: uuid
          type: string
        destination_currency:
          $ref: '#/components/schemas/Currency'
        external_id:
          description: External ID for the autoramp, provided by the partner
          type: string
        fee_profile_id:
          description: The fee profile id to use for the autoramp. If not provided, the default fee profile for the partner will be used.
          format: uuid
          type: string
        fps_payment_reference:
          description: reference message attached to outgoing FPS transfers (max 18 chars)
          maxLength: 18
          minLength: 6
          pattern: ^[A-Za-z]*$
          type: string
        name:
          description: The name of the autoramp
          type: string
        pay_by_reference:
          default: null
          description: If true, a payment reference will be generated for the autoramp. Defaults to false if not provided.
          type: boolean
        recipient_account:
          $ref: '#/components/schemas/Account'
        sepa_payment_reference:
          description: reference message attached to outgoing SEPA transfers (max 140 chars)
          maxLength: 140
          minLength: 6
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
        source_currencies:
          description: The list of source currencies
          items:
            $ref: '#/components/schemas/Currency'
          type: array
        source_is_third_party:
          description: |-
            The source should be third party. E.g. a fiat account that allows
            receiving 3pp payments.
          type: boolean
        swift_payment_reference:
          description: reference message attached to outgoing SWIFT transfers (max 4 lines, 35 chars per line)
          maxLength: 140
          minLength: 1
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
        wire_message:
          description: reference message attached to outgoing wire transfers (max 4 lines, 35 chars per line)
          maxLength: 140
          minLength: 1
          pattern: ^[A-Za-z0-9 /\-?:().+]*$
          type: string
      required:
      - source_currencies
      - destination_currency
      - recipient_account
      - customer_id
      title: CreateAutorampParameters
      type: object
    CreateCustomerParams:
      description: |
        Customer Params

        Parameters for creating a customer
      properties:
        customer_type:
          $ref: '#/components/schemas/CustomerType'
        email:
          description: |-
            The primary point of contact email address for the customer
            Note that this email address will be used for all API authorization (e.g. 2FA)
          type: string
        external_id:
          description: External ID for the customer, provided by the partner
          type: string
        name:
          description: The name of the customer
          type: string
      required:
      - customer_type
      - email
      title: CreateCustomerParams
      type: object
    CreatePartnerFeeProfileRequest:
      description: |-
        Create Partner Fee Profile Request

        Parameters for creating a new transactional fee profile as a partner.
        Iron fee settings (including whether the on-chain network fee is enabled)
        are inherited from the partner's invoicing fee profile.
      properties:
        banking_fee_configs:
          description: |-
            Banking fee configurations. Each entry's fee currency is constrained
            by its rail to avoid FX exposure:
            SEPA→EUR, FPS/CHAPS→GBP, PIX→BRL, SPEI→MXN, all other rails (ACH,
            WIRE, RTP, SWIFT, CHATS, AFRICAN_BANK_TRANSFER, MOBILE_MONEY)→USD.
          items:
            $ref: '#/components/schemas/BankingFeeConfiguration'
          type: array
        name:
          description: The name of the fee profile
          type: string
        network_fee_settlement:
          $ref: '#/components/schemas/FeeSettlement'
        transaction_fee_bips:
          description: Transaction fee in basis points (bps). 100 bps = 1%.
          format: uint32
          type: integer
      required:
      - name
      - network_fee_settlement
      - transaction_fee_bips
      - banking_fee_configs
      title: CreatePartnerFeeProfileRequest
      type: object
    CreateSandboxTransactionParams:
