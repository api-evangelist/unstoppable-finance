      title: Customer
      type: object
    CustomerAbilities:
      description: |
        Customer Abilities

        Represents the abilities/capabilities that a customer has
      properties:
        currencies:
          description: |-
            What the customer can do with each currency (mint / redeem / onramp /
            offramp / swap). Only currencies the customer can currently use are listed.
          items:
            $ref: '#/components/schemas/CurrencyAbility'
          type: array
        fiat_deposit:
          $ref: '#/components/schemas/ApiFiatAbilities'
        fiat_payout:
          $ref: '#/components/schemas/ApiFiatAbilities'
      required:
      - fiat_deposit
      - fiat_payout
      - currencies
      title: CustomerAbilities
      type: object
    CustomerRequirements:
      description: |-
        Bridge-style requirements view of a customer. All four buckets are
        always present (may be empty). `requirements_due` is a quick coarse
        summary — partners can use it to decide whether any action is needed
        before drilling into the detail buckets.
      properties:
        complete:
          description: Requirements the customer has satisfied.
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        issues:
          description: Terminal blockers the customer cannot self-remediate.
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        missing:
          description: Requirements the customer can still satisfy (resubmittable).
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        pending:
          description: Requirements the customer has submitted, awaiting review.
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        requirements_due:
          description: |-
            Sorted, deduplicated set of categories that have at least one
            non-complete item. Empty for fully-onboarded customers.
          items:
            $ref: '#/components/schemas/RequirementCategory'
          type: array
      required:
      - requirements_due
      - complete
      - pending
      - missing
      - issues
      title: CustomerRequirements
      type: object
    CustomerSpendingLimit:
      description: |-
        Customer Spending Limit

        Current usage of the rolling 52-week spending limit split by direction.
      properties:
        crypto_offramp:
          $ref: '#/components/schemas/CustomerSpendingLimitSection'
        fiat_onramp:
          $ref: '#/components/schemas/CustomerSpendingLimitSection'
      required:
      - fiat_onramp
      - crypto_offramp
      title: CustomerSpendingLimit
      type: object
    CustomerSpendingLimitSection:
      description: |-
        Customer Spending Limit Section

        Usage of the rolling 52-week spending limit for a single direction
        (fiat on-ramp or crypto off-ramp).

        Amounts are returned in **EUR cents** as strings

        `threshold_eur` (and therefore `remaining_eur`) is `null` when the customer
        has no enforced cap — for example Business customers or persons with
        `ThresholdKind::Regulated`. A `null` threshold does **not** mean "unknown";
      properties:
        period_end:
          description: End of the current rolling window for this direction (now).
          format: date-time
          type: string
        period_start:
          description: |-
            Start of the current rolling window for this direction. This is the
            later of "52 weeks ago" and the last `Reset` event for this volume
            kind — fiat and crypto windows are tracked independently and can
            differ if compliance has reset only one bucket.
          format: date-time
          type: string
        remaining_eur:
          description: |-
            `threshold_eur - used_eur`, floored at zero, in EUR cents as a string.
            `null` iff `threshold_eur` is `null`.
          type: string
        threshold_eur:
          description: Enforced limit in EUR cents as a string. `null` when no cap applies.
          type: string
        used_eur:
          description: Volume consumed in the window in EUR cents as a string. Always returned.
          type: string
      required:
      - period_start
      - period_end
      - used_eur
      title: CustomerSpendingLimitSection
      type: object
    CustomerStatus:
      description: |
        The status of the Customer
      enum:
      - UserRequired
