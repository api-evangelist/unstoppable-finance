components:
  parameters:
    XApiVersion:
      description: 'Selects the API version for this request, as an ISO date (`YYYY-MM-DD`). Omit to use the default version (`2025-03-13`). Supported versions: 2025-03-13, 2026-07-01.'
      in: header
      name: X-API-Version
      required: false
      schema:
        type: string
  schemas:
    ACHDepositInfo:
      example:
        account_number: '123456789'
        bank_address: 1 Chase Manhattan Plaza, New York, NY 10005, US
        bank_name: JPMorgan Chase Bank
        recipient_address: 123 Main Street, New York, NY 10001, US
        recipient_name: Alan Turing
        routing_number: '021000021'
      properties:
        account_number:
          type: string
        bank_address:
          type: string
        bank_name:
          type: string
        recipient_address:
          type: string
        recipient_name:
          type: string
        routing_number:
          type: string
      required:
      - routing_number
      - account_number
      - bank_name
      - bank_address
      - recipient_name
      - recipient_address
      title: ACHDepositInfo
      type: object
    AbilityStatus:
      description: The current status of the ability
      enum:
      - Active
      - Pending
      - Unavailable
      - Blocked
      - Maintenance
      type: string
    Account:
      anyOf:
      - $ref: '#/components/schemas/Account_FiatAccount'
      - $ref: '#/components/schemas/Account_CryptoWallet'
      - $ref: '#/components/schemas/Account_PixAccount'
      description: |
        Account

        The account for the autoramp
      discriminator:
        mapping:
          Crypto: '#/components/schemas/Account_CryptoWallet'
          Fiat: '#/components/schemas/Account_FiatAccount'
          Pix: '#/components/schemas/Account_PixAccount'
        propertyName: type
      type: object
    Account_CryptoWallet:
      allOf:
      - properties:
          type:
            enum:
            - Crypto
            example: Crypto
            type: string
        required:
        - type
        type: object
      - $ref: '#/components/schemas/CryptoWallet'
      description: |
        Account

        The account for the autoramp
    Account_FiatAccount:
      allOf:
      - properties:
          type:
            enum:
            - Fiat
            example: Fiat
            type: string
        required:
        - type
        type: object
      - $ref: '#/components/schemas/FiatAccount'
      description: |
        Account

        The account for the autoramp
    Account_PixAccount:
      allOf:
      - properties:
          type:
            enum:
            - Pix
            example: Pix
            type: string
        required:
        - type
        type: object
      - $ref: '#/components/schemas/PixAccount'
      description: |
        Account

        The account for the autoramp
    AchWireDepositInfo:
      example:
        account_number: '123456789'
        bank_address: 1 Chase Manhattan Plaza, New York, NY 10005, US
        bank_name: JPMorgan Chase Bank
        recipient_address: 123 Main Street, New York, NY 10001, US
        recipient_name: Alan Turing
        routing_number: '021000021'
      properties:
        account_number:
          type: string
        bank_address:
          type: string
        bank_name:
          type: string
        recipient_address:
          type: string
        recipient_name:
          type: string
        routing_number:
          type: string
      required:
      - routing_number
      - account_number
      - bank_name
      - bank_address
      - recipient_name
      - recipient_address
      title: AchWireDepositInfo
      type: object
    Address:
      description: Address
      properties:
        city:
          description: city
          type: string
        country:
          description: country (2-character ISO 3166)
          type: string
        state:
          description: state/province/region
          type: string
        street_1:
          description: street address
          type: string
        street_2:
          description: street address (additional)
          type: string
        zip_code:
          description: zip code
          type: string
      required:
      - street_1
      - city
      - zip_code
      - country
      title: Address
      type: object
    AddressFilter:
      description: |
        Filter for address types when retrieving signatures

        Specifies which type of addresses to return
      enum:
      - Hosted
      - SelfHosted
      - All
      type: string
    AddressType:
      enum:
      - Hosted
      - SelfHosted
      type: string
    AfricanBankTransferDepositInfo:
      properties:
        account_name:
          type: string
        account_number:
          type: string
        amount:
          format: decimal
          type: string
        bank_name:
          type: string
        currency:
          type: string
        financial_institution:
          $ref: '#/components/schemas/Bank'
        instruction:
          type: string
        reference_id:
          type: string
      title: AfricanBankTransferDepositInfo
      type: object
    Amount:
      description: |
        An amount of money
      example:
        amount: '100.5'
        currency:
          code: USD
          type: Fiat
      properties:
        amount:
          description: The amount, a decimal number
          format: decimal
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - amount
      - currency
      title: Amount
      type: object
    ApiAutorampOpenBankingPayment:
      description: |-
        Autoramp Open Banking Payment with link to initiate flow

        One payment attempt against a provider for an autoramp's open-banking flow.
      properties:
        id:
          description: |-
            The provider's payment ID (e.g. tokenio's payment ID). Use this with
            the GET-by-id endpoint to look up the latest status.
          type: string
        iron_payment_id:
          description: |-
            Iron's internal identifier for this open banking payment. Use this
            as the pagination cursor when listing payments.
          format: uuid
          type: string
        payment_link:
          type: string
        settlement_status:
          $ref: '#/components/schemas/ApiAutorampOpenBankingPaymentSettlementStatus'
        status:
          $ref: '#/components/schemas/ApiAutorampOpenBankingPaymentStatus'
      required:
      - id
      - iron_payment_id
      - status
      title: ApiAutorampOpenBankingPayment
      type: object
    ApiAutorampOpenBankingPaymentSettlementStatus:
      enum:
      - InProgress
      - Completed
      - Incomplete
      type: string
    ApiAutorampOpenBankingPaymentStatus:
      description: |
        Autoramp Payment Link Status

        The status of the autoramp payment link
      enum:
      - Pending
      - Ready
      - Processing
      - Completed
      - Failed
      type: string
    ApiAutorampQuotePreview:
      description: |
        Autoramp Quote Preview

        A recipient-free pricing preview, shaped like a signed quote but not
        submittable: no quote_id, signature, or validity window.
      properties:
        amount_in:
          $ref: '#/components/schemas/Amount'
        amount_out:
          $ref: '#/components/schemas/Amount'
        assumed_payout_rail:
          $ref: '#/components/schemas/PaymentNetwork'
        customer_id:
          description: The customer id
          format: uuid
          type: string
        destination_currency:
          $ref: '#/components/schemas/Currency'
        fee:
          $ref: '#/components/schemas/Fee'
        fee_profile_id:
          description: The fee profile this preview was priced against
          format: uuid
          type: string
        fee_settlement:
          $ref: '#/components/schemas/FeeSettlement'
        rate:
          description: The rate (destination per 1 source)
          format: decimal
          type: string
        source_currency:
          $ref: '#/components/schemas/Currency'
      required:
      - source_currency
      - destination_currency
      - customer_id
      - amount_in
      - amount_out
      - rate
      - fee
      - fee_settlement
      - fee_profile_id
      title: ApiAutorampQuotePreview
      type: object
    ApiBankAccountSource:
      description: A bank account source of an autoramp transaction
      example:
        account_number: null
        bank_name: Iron Bank
        bic: COBADEFFXXX
        iban: DE89370400440532013000
        name: Alan Turing
        routing_number: null
        sort_code: null
      properties:
        account_number:
          description: The account number for US accounts
          type: string
        bank_name:
          description: The bank name
          type: string
        bic:
          description: The bic
          type: string
        iban:
          description: The iban
          type: string
        name:
          description: The name of the account holder
          type: string
        routing_number:
          description: The routing number of the bank, for US accounts
          type: string
        sort_code:
          description: The sort code of the bank, for UK accounts
          type: string
      required:
      - bank_name
      - iban
      - bic
      - name
      title: ApiBankAccountSource
      type: object
    ApiCanCreateAutorampResponse:
      description: |
        Can Create Autoramp Response

        Indicates whether a customer can create a new autoramp.
      properties:
        can_create:
          description: Whether the customer can create a new autoramp based on the provided parameters.
          type: boolean
      required:
      - can_create
      title: ApiCanCreateAutorampResponse
      type: object
    ApiError:
      description: |-
        Standard error response returned to API clients for server errors.
        Includes a trace_id that clients can reference when reporting issues.
      properties:
        message:
          description: Human-readable error message
          type: string
        trace_id:
          description: Trace ID that can be used to look up request details in logs
          type: string
      required:
      - message
      - trace_id
      title: ApiError
      type: object
    ApiFiatAbilities:
      description: |-
        Fiat rails
        Customer's ability to use fiat deposit and payout rails
      properties:
        eur:
          $ref: '#/components/schemas/EurAbilities'
        gbp:
          $ref: '#/components/schemas/GbpAbilities'
        usd:
          $ref: '#/components/schemas/UsdAbilities'
      required:
      - eur
      - gbp
      - usd
      title: ApiFiatAbilities
      type: object
    ApiThirdPartyClassification:
      enum:
      - FirstParty
      - ThirdParty
      - Inconclusive
      - Unknown
      type: string
    ApiWalletDepositSource:
      description: A wallet deposit source of an autoramp transaction
      example:
        blockchain: Solana
        deposit_tx_hash: 45E89p7aRyUzsqbqstCkKqxaaeYXgagbq8ccHCZWMRN1E8KAqoEPACDasVjkMMbDJGwrwFHz5RDT67kUN3p5Rk81
        wallet_address: 7QqLDBU5iT4VWshsqRdWKHjKdqZqKqYbpjhCkqDnKXSp
      properties:
        blockchain:
          description: The blockchain
          type: string
        deposit_tx_hash:
          description: The deposit transaction hash
          type: string
        wallet_address:
          description: The wallet address
          type: string
      required:
      - wallet_address
      - blockchain
      title: ApiWalletDepositSource
      type: object
    ApproximateNetWorth:
      description: |
        Approximate Net Worth

        The approximate net worth of the person
      enum:
      - UpTo25000
      - Between25001And50000
      - Between50001And100000
      - Between100001And300000
      - Between300001And500000
      - Between500001And1000000
      - Over1000001
      type: string
    AuthenticationCode:
      description: |
        An authentication code

        used to confirm a 2FA action
      properties:
        attempts:
          description: attempts to submit the authentication code
          format: int32
          type: integer
        entity_id:
          description: the ID of the entity the authentication is related to
          format: uuid
          type: string
        expires_at:
          description: the time of expiry for the authentication code
          format: date-time
          type: string
        id:
          description: The ID of the authentication code
          format: uuid
          type: string
        status:
          $ref: '#/components/schemas/AuthenticationCodeStatus'
      required:
      - id
      - status
      - expires_at
      - attempts
      - entity_id
      title: AuthenticationCode
      type: object
    AuthenticationCodeStatus:
      description: The status of the Authentication Code
      enum:
      - Pending
      - Expired
      - Confirmed
      - Rejected
      type: string
    Autoramp:
      description: |-
        Autoramp

        The autoramp response

        A Autoramp response
      properties:
        additional_partner_fee_in_bips:
          description: The additional partner fee in bips
          format: decimal
          type: string
        batch_payout:
          description: Whether payouts for this autoramp are batched daily
          type: boolean
        created_at:
          description: The created at timestamp
          format: date-time
          type: string
        customer_id:
          description: The id of the customer that owns the autoramp
          format: uuid
          type: string
        deposit_account:
          allOf:
          - $ref: '#/components/schemas/DepositAccount'
          - deprecated: true
            description: Deprecated, please use the information in the deposit_rails field instead
          deprecated: true
          description: Deprecated, please use the information in the deposit_rails field instead
        deposit_rails:
          items:
            $ref: '#/components/schemas/DepositRail'
          type: array
        destination_currency:
          $ref: '#/components/schemas/Currency'
        external_id:
          description: External ID for the autoramp, provided by the partner
          type: string
        fee_profile_id:
          description: The fee profile id used for the autoramp
          format: uuid
          type: string
        fps_payment_reference:
          description: reference message for outgoing FPS transfers
          type: string
        id:
          description: The id of the autoramp
          format: uuid
          type: string
        inbound_payment_reference:
          description: |-
            System-generated inbound memo that senders must include on transfers
            to the shared VA. `None` for autoramps that don't use pay-by-reference.
          type: string
        is_third_party:
          description: Is this a third party payment (3pp) autoramp
          type: boolean
        kind:
          $ref: '#/components/schemas/AutorampType'
        name:
          description: The name of the autoramp
          type: string
        payment_reference:
          description: The payment reference for the autoramp
          type: string
        quote:
          allOf:
          - $ref: '#/components/schemas/AutorampQuote'
          - deprecated: true
            description: 'Deprecated: use the `quotes` field instead. Returns the newest active (non-expired) quote if any.'
          deprecated: true
          description: 'Deprecated: use the `quotes` field instead. Returns the newest active (non-expired) quote if any.'
        quotes:
          description: |-
            Active (non-expired) quotes associated with this autoramp. Deposits are
            matched to the newest active quote with matching `amount_in` value and
            currency.
          items:
            $ref: '#/components/schemas/AutorampQuote'
          type: array
        recipient:
          $ref: '#/components/schemas/Recipient'
        sepa_payment_reference:
          description: reference message for outgoing SEPA transfers
          type: string
        source:
          $ref: '#/components/schemas/AutorampSource'
        source_currencies:
          description: The source currencies
          items:
            $ref: '#/components/schemas/Currency'
          type: array
        status:
          $ref: '#/components/schemas/AutorampStatus'
        swift_payment_reference:
          description: reference message for outgoing SWIFT transfers
          type: string
        travel_address:
          description: The travel rule address for compliance
          type: string
        wire_message:
          description: reference message for outgoing wire transfers
          type: string
      required:
      - id
      - customer_id
      - status
      - kind
      - created_at
      - source_currencies
      - destination_currency
      - source
      - quotes
      - is_third_party
      - recipient
      - deposit_rails
      - fee_profile_id
      - batch_payout
      title: Autoramp
      type: object
    AutorampQuote:
      description: |
        Autoramp Quote

        The autoramp quote used to create an autoramp
      properties:
        amount_in:
          $ref: '#/components/schemas/Amount'
        amount_out:
          $ref: '#/components/schemas/Amount'
        fee:
          $ref: '#/components/schemas/Fee'
        fee_settlement:
          $ref: '#/components/schemas/FeeSettlement'
        partner_fee_settlement:
          $ref: '#/components/schemas/FeeSettlement'
        quote_id:
          description: The id of the quote
          format: uuid
          type: string
        rate:
          description: The rate
          format: decimal
          type: string
        rate_expiry_policy:
          $ref: '#/components/schemas/RateExpiryPolicy'
        rate_lock_valid_until:
          description: The rate lock valid until
          format: date-time
          type: string
        slippage_tolerance_in_bips:
          description: The slippage tolerance in bips
          format: decimal
          type: string
        valid_until:
          description: The valid until
          format: date-time
          type: string
      required:
      - quote_id
      - amount_in
      - amount_out
      - rate
      - rate_lock_valid_until
      - rate_expiry_policy
      - fee
      - fee_settlement
      - partner_fee_settlement
      - valid_until
      title: AutorampQuote
      type: object
    AutorampSource:
      description: |-
        Autoramp Source

        The source of the autoramp
      enum:
      - Standalone
      - Quote
      type: string
    AutorampStatus:
      enum:
      - Created
      - EditPending
      - Authorized
      - DepositAccountAdded
      - Approved
      - Rejected
      - Cancelled
      type: string
    AutorampTransaction:
      description: |-
        Autoramp Transaction

        The autoramp transaction response

        A Payment response
      properties:
        autoramp_id:
          description: The ID of the autoramp this transaction belongs to
          format: uuid
          type: string
        batch_id:
          description: The batch ID if this transaction was part of a batch payout
          format: uuid
          type: string
        created_at:
          description: Date of transaction creation
          format: date-time
          type: string
        customer_id:
          description: The ID of the customer two whom this transaction belongs
          format: uuid
          type: string
        destination_amount:
          $ref: '#/components/schemas/Amount'
        exchange_rate:
          description: The exchange rate
          format: decimal
          type: string
        fee:
          description: The total fee charged
          format: decimal
          type: string
        fee_breakdown:
          $ref: '#/components/schemas/Fee'
        fee_settlement:
          $ref: '#/components/schemas/FeeSettlement'
        id:
          description: The ID of the transaction
          format: uuid
          type: string
        inbound_payment_reference:
          description: reference of this transaction's pay-in transfer
          type: string
        is_third_party:
          description: Is this a third party payment (3pp) autoramp
          type: boolean
        kind:
          $ref: '#/components/schemas/AutorampType'
        ob_payment_id:
          description: |-
            The id of the open-banking payment that initiated this
            transaction, if any. Use this to look up the ob_payment via the
            `getAutorampOpenBankingPayment` endpoint family.
          type: string
        payment_tracking:
          $ref: '#/components/schemas/PaymentTracking'
        payout_crypto_transaction:
          $ref: '#/components/schemas/PayoutCryptoTransaction'
        recipient:
          $ref: '#/components/schemas/Recipient'
        source:
          $ref: '#/components/schemas/RampTransactionSource'
        source_amount:
          $ref: '#/components/schemas/Amount'
        state:
          allOf:
          - $ref: '#/components/schemas/AutorampTransactionState'
          - deprecated: true
            description: 'The current state of the transaction. DEPRECATED: use ''status'''
          deprecated: true
          description: 'The current state of the transaction. DEPRECATED: use ''status'''
        status:
          $ref: '#/components/schemas/AutorampTransactionStatus'
        third_party_classification:
          $ref: '#/components/schemas/ApiThirdPartyClassification'
      required:
      - id
      - customer_id
      - autoramp_id
      - state
      - status
      - source_amount
      - destination_amount
      - recipient
      - fee
      - exchange_rate
      - created_at
      - fee_settlement
      - is_third_party
      - kind
      title: AutorampTransaction
      type: object
    AutorampTransactionState:
      description: |
        Autoramp Transaction State

        The state of the autoramp transaction
      enum:
      - Pending
      - PayoutPending
      - Payout
      - PayoutCompleted
      - Completed
      - Failed
      - InAmlReview
      - AmlRejected
      - AmountRejected
      - FraudRejected
      type: string
    AutorampTransactionStatus:
      description: |
        Autoramp Transaction Status

        The status of the autoramp transaction
      enum:
      - FundsReviewInProgress
      - ConversionInProgress
      - PayoutInProgress
      - Completed
      - Failed
      - RejectedAml
      - RejectedFraud
      - RejectedMinAmount
      type: string
    AutorampType:
      description: |-
        Autoramp type

        The type (onramp, offramp, swap) of an autoramp
      enum:
      - Onramp
      - Offramp
      - Swap
      - Mint
      - Redeem
      type: string
