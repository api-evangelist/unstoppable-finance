    RequirementItem:
      description: 'A single requirement entry returned in one of the four buckets on

        `ApiCustomerRequirements`.'
      properties:
        code:
          $ref: '#/components/schemas/RequirementCode'
        description:
          description: 'Human-readable reason from Sumsub — the moderation comment and the

            applicant-facing client comment combined (moderator note first,

            deduped), a list of the specific unanswered questionnaire questions, or

            a synthesized note for the identification-level codes. May be `null`.

            *IMPORTANT*: This field is subject to change without notice — switch

            on `code` (and `reject_labels`), not on this string.'
          type: string
        identification_id:
          description: The identification that produced this item, when applicable.
          format: uuid
          type: string
        missing_questions:
          description: 'Required questionnaire questions the customer left unanswered, resolved

            against the Sumsub questionnaire definition (so `title` is the question

            text the applicant saw). Only populated for the questionnaire codes

            (`kyc_questionnaire` / `kyb_questionnaire`); empty otherwise.'
          items:
            $ref: '#/components/schemas/MissingQuestion'
          type: array
        reject_labels:
          description: 'Coded Sumsub rejection reasons for this step (e.g. `SCREENSHOTS`,

            `UNSATISFACTORY_PHOTOS`) — the pills shown in the Sumsub dashboard.

            Empty when the step carries no labels.'
          items:
            type: string
          type: array
        reject_reasons:
          description: 'Same reasons as `reject_labels`, each paired with a human-readable

            description. Prefer this for display; `reject_labels` stays the stable

            set of codes to switch on. Empty when the step carries no labels.'
          items:
            $ref: '#/components/schemas/RejectReason'
          type: array
        retryable:
          description: '`true` if the customer can resubmit to clear this item

            (Sumsub `reject_type == Retry`). `false` for terminal/Final

            rejections. `null` for `complete`/`pending` items, where retry

            semantics don''t apply.'
          type: boolean
      required:
      - code
      - reject_labels
      - reject_reasons
      - missing_questions
      title: RequirementItem
      type: object
