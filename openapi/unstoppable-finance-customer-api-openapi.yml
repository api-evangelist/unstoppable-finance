        requirement: read them in the currency the business reports in, so a company reporting

        60,000 USD sends FiftyToOneHundredThousand. Do not convert at an FX rate. There is no

        separate band set per currency.

        '
      enum:
      - TenToTwentyFiveThousand
      - TwentyFiveToFiftyThousand
      - FiftyToOneHundredThousand
      - OneHundredToTwoHundredFiftyThousand
      - TwoHundredFiftyToFiveHundredThousand
      - MoreThanFiveHundredThousand
      type: string
    PagedList_Signing:
      description: 'PagedList


        A list of items with cursors used to fetch the next or previous page

        '
      properties:
        cursor:
          description: The cursor used to fetch the next page
          format: uuid
          type: string
        items:
          description: The list of items
          items:
            $ref: '#/components/schemas/Signing'
          type: array
        prev_cursor:
          default: null
          description: The cursor used to fetch the previous page
          format: uuid
          type: string
      required:
      - items
      title: PagedList_Signing
      type: object
  parameters:
    XApiVersion:
      description: 'Selects the API version for this request, as an ISO date (`YYYY-MM-DD`). Omit to use the default version (`2025-03-13`). Supported versions: 2025-03-13, 2026-07-01, 2026-08-01, 2026-10-01, 2026-10-15.'
      in: header
      name: X-API-Version
      required: false
      schema:
        type: string
  securitySchemes:
    ApiKeyAuth:
      description: API Key
      in: header
      name: X-API-Key
      type: apiKey
