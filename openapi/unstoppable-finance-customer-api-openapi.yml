components:
  schemas:
    ComplianceQuestionaire:
      description: 'V1 Compliance Questionnaire


        Legacy compliance questionnaire format

        '
      properties:
        employment_status:
          $ref: '#/components/schemas/EmploymentStatus'
        expected_monthly_volume:
          $ref: '#/components/schemas/PersonProfileExpectedMonthlyTransactionVolume'
        id:
          format: uuid
          type: string
        intended_use:
          $ref: '#/components/schemas/IntendedUse'
        monthly_income:
          $ref: '#/components/schemas/PersonProfileMonthlyIncome'
        occupation:
          $ref: '#/components/schemas/Occupation'
        source_of_funds:
          $ref: '#/components/schemas/PersonProfileSourceOfFunds'
        source_of_funds_proof:
          type: string
      required:
      - id
      - intended_use
      title: ComplianceQuestionaire
      type: object
    BirthPlace:
      description: 'Birth place


        The place of birth of the person

        '
      properties:
        country:
          description: ISO 3166-1 alpha-2 (2 letter) country code of the place of birth
          type: string
        place:
          description: place of birth
          type: string
        state:
          description: 'state of birth. Required only for countries with ISO 3166-2

            administrative subdivisions (e.g. not required for countries with

            none, like Vatican City).'
          type: string
      required:
      - place
      - country
      title: BirthPlace
      type: object
    ApiError:
      description: 'Standard error response returned to API clients for server errors.

        Includes a trace_id that clients can reference when reporting issues.'
      properties:
        message:
          description: Human-readable error message
          type: string
        trace_id:
          description: Trace ID that can be used to look up request details in logs
          type: string
      required:
      - message
      - trace_id
      title: ApiError
      type: object
    GenericBusinessQuestionnaire:
      description: 'KYB compliance questionnaire for standard company types

        '
      properties:
        business_details:
          $ref: '#/components/schemas/BusinessQuestionnaireBusinessDetails'
        planned_activities:
          $ref: '#/components/schemas/BusinessQuestionnairePlannedActivities'
        source_of_funds:
          $ref: '#/components/schemas/BusinessQuestionnaireSourceOfFunds'
      required:
      - planned_activities
      - source_of_funds
      - business_details
      title: GenericBusinessQuestionnaire
      type: object
    UpdateIdentificationDataParams:
      description: 'Update Identification Data Params


        Partial update for a person customer''s existing KYC record. Only

        non-null fields are applied; today only the tax identification number

        is supported.'
      properties:
        tax_identification_number:
          description: 'Tax identification number (e.g. SSN for US, national TIN for EEA

            residents). Patched directly onto the customer''s existing KYC

            record — does not trigger re-verification, so an already-approved

            customer''s status is unaffected.'
          type: string
        tax_residence_country:
          description: 'ISO 3166-1 alpha-2 country of tax residence. Required whenever

            `tax_identification_number` is set — TIN format is validated against

            this specific country, and it can genuinely differ from the

            customer''s physical residence or nationality (the reason DAC8/CARF

            asks for it separately).'
          type: string
      title: UpdateIdentificationDataParams
      type: object
    CompanyBeneficiary:
      description: 'Company Beneficial Owner


        The beneficial owner of the company

        '
      properties:
        attested_at:
          description: 'When the beneficiary certified the information (RFC 3339, in the past).

            Required when attesting_party is true.'
          type: string
        attesting_party:
          description: 'Marks this beneficiary as certifying the beneficial-ownership information

            (31 CFR 1010.230). Root-level person holding a Director role only. Required

            (exactly one beneficiary must set this to true) for every US

            non-sole-proprietorship business — Iron always generates and submits the

            certification on the attesting party''s behalf, satisfying the Ownership

            Structure document requirement. Before setting this flag, present the

            collected beneficial-ownership information to this beneficiary and obtain

            their confirmation that it is complete and correct — Iron renders a

            certification naming them from the submitted data. Limited to simple

            ownership structures (at most three levels of beneficiaries: root, a

            nested business, and that business''s own nested business); deeper

            structures cannot use this endpoint.'
          type: boolean
        beneficiary_info:
          $ref: '#/components/schemas/CompanyBeneficiaryInfo'
        nature_of_control:
          description: 'How a Control UBO exercises control, e.g. voting rights or a trust relationship

            (max 255 characters). Available from API version 2026-10-15. Required for

            Control and rejected otherwise.'
          type: string
        roles:
          description: The primary role of the beneficial owner
          items:
            $ref: '#/components/schemas/CompanyPrimaryBeneficiaryRole'
          type: array
        share_percentage:
          description: 'Share percentage of the beneficial owner (0-100). The combined shares of

            UltimateBeneficialOwner beneficiaries must not exceed 100 per company.'
          format: decimal
          type: string
        ubo_subtype:
          $ref: '#/components/schemas/BeneficiaryUboSubtype'
      required:
      - roles
      - beneficiary_info
      title: CompanyBeneficiary
      type: object
    PersonProfileSourceOfFunds:
      description: 'Source of Funds


        The sources of funds for a person

        '
      enum:
