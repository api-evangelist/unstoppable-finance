    CustomerSpendingLimitSection:
      description: 'Customer Spending Limit Section


        Usage of the rolling 52-week spending limit for a single direction

        (fiat on-ramp or crypto off-ramp).


        Amounts are returned in **EUR cents** as strings


        `threshold_eur` (and therefore `remaining_eur`) is `null` when the customer

        has no enforced cap — for example Business customers or persons with

        `ThresholdKind::Regulated`. A `null` threshold does **not** mean "unknown";'
      properties:
        currency:
          $ref: '#/components/schemas/Fiat'
        period_end:
          description: End of the current rolling window for this direction (now).
          format: date-time
          type: string
        period_start:
          description: 'Start of the current rolling window for this direction. This is the

            later of "52 weeks ago" and the last `Reset` event for this volume

            kind — fiat and crypto windows are tracked independently and can

            differ if compliance has reset only one bucket.'
          format: date-time
          type: string
        remaining:
          description: '`threshold - used`, floored at zero, in `currency` cents as a string.

            `null` iff `threshold` is `null`.'
          type: string
        remaining_eur:
          description: 'Deprecated: EUR-converted view of `remaining`. Prefer `remaining`.'
          type: string
        threshold:
          description: 'Enforced limit in `currency` cents as a string. `null` when no cap

            applies. This is the authoritative value the limit is enforced against.'
          type: string
        threshold_eur:
          description: 'Deprecated: EUR-converted view of `threshold` (mid-market rate at read

            time). Prefer `threshold` + `currency`.'
          type: string
        used:
          description: Volume consumed in the window in `currency` cents as a string.
          type: string
        used_eur:
          description: 'Deprecated: EUR-converted view of `used`. Prefer `used` + `currency`.'
          type: string
      required:
      - period_start
      - period_end
      - currency
      - used
      - used_eur
      title: CustomerSpendingLimitSection
      type: object
