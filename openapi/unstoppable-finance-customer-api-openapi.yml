components:
  schemas:
    BusinessQuestionnaire_GenericBusinessQuestionnaire:
      allOf:
      - properties:
          type:
            enum:
            - Generic
            example: Generic
            type: string
        required:
        - type
        type: object
      - $ref: '#/components/schemas/GenericBusinessQuestionnaire'
      description: 'KYB compliance questionnaire


        Use `GenericBusinessQuestionnaire` for all company types except sole proprietorships.

        Use `SolePropBusinessQuestionnaire` for sole proprietorships.

        '
    Customer:
      description: 'Customer


        The customer object in Iron

        '
      properties:
        active_email:
          description: Active email for receiving transaction emails (if different from primary email)
          type: string
        created_at:
          description: Created at timestamp of Customer
          format: date-time
          type: string
        customer_type:
          $ref: '#/components/schemas/CustomerType'
        email:
          description: Email of Customer, collected during identification process
          type: string
        external_id:
          description: External ID for the customer, provided by the partner
          type: string
        id:
          description: Unique ID of Customer
          format: uuid
          type: string
        identification_ids:
          description: Identifications associated with Customer
          items:
            format: uuid
            type: string
          type: array
        identification_status:
          $ref: '#/components/schemas/IdentificationStatus'
        name:
          description: Name of Customer
          type: string
        partner_id:
          description: Partner ID of the customer
          format: uuid
          type: string
        signing_ids:
          description: Signings associated with Customer
          items:
            format: uuid
            type: string
          type: array
        spending_limit_euro:
          deprecated: true
          description: 'Deprecated — always null. Spending limits are dynamic per customer and per

            direction; use `GET /customers/{id}/spending-limit` (`threshold_eur`) instead.'
          type: string
        status:
          $ref: '#/components/schemas/CustomerStatus'
        updated_at:
          description: Updated at timestamp of Customer
          format: date-time
          type: string
      required:
      - id
      - customer_type
      - identification_ids
      - signing_ids
      - created_at
      - updated_at
      - status
      - name
      - email
      - partner_id
      title: Customer
      type: object
    CustomerRequirements:
      description: 'Bridge-style requirements view of a customer. All four buckets are

        always present (may be empty). `requirements_due` is a quick coarse

        summary — partners can use it to decide whether any action is needed

        before drilling into the detail buckets.'
      properties:
        complete:
          description: Requirements the customer has satisfied.
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        issues:
          description: Terminal blockers the customer cannot self-remediate.
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        missing:
          description: Requirements the customer can still satisfy (resubmittable).
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        pending:
          description: Requirements the customer has submitted, awaiting review.
          items:
            $ref: '#/components/schemas/RequirementItem'
          type: array
        requirements_due:
          description: 'Sorted, deduplicated set of categories that have at least one

            non-complete item. Empty for fully-onboarded customers.'
          items:
            $ref: '#/components/schemas/RequirementCategory'
          type: array
      required:
      - requirements_due
      - complete
      - pending
      - missing
      - issues
      title: CustomerRequirements
      type: object
    Currency_Fiat:
      allOf:
      - properties:
          type:
            enum:
            - Fiat
            example: Fiat
            type: string
        required:
        - type
        type: object
      - $ref: '#/components/schemas/Fiat'
      description: 'Currency


        Can be either crypto or fiat

        '
    IdentificationCreateParamsV2_IdentificationTokenParams:
      allOf:
      - properties:
          type:
            enum:
            - Token
            example: Token
            type: string
        required:
        - type
        type: object
      - $ref: '#/components/schemas/IdentificationTokenParams'
      description: 'Identification Create Params V2


        The params required to create an identification v2, we support three types of identification:

        - Link: where a link is provided to the customer for access to the identification process.

        - Token: where a token is provided in the request from which verification data can be extracted and where the token is generated by the third party provider

        - Person: where the identification details of the person for which the identification process is being created are provided in the request

        '
    SolePropBusinessDetails:
      description: 'Sole Prop Business Details Section

        '
      properties:
        business_model_description:
          description: Description of business model and target clients
          type: string
        estimated_annual_revenue:
          $ref: '#/components/schemas/BusinessEstimatedAnnualRevenue'
        industry_type:
          $ref: '#/components/schemas/BusinessIndustryType'
        main_business_countries:
          description: Main countries of business operation (ISO 3166-1 alpha-2 codes)
          items:
            type: string
          type: array
      required:
      - industry_type
      - business_model_description
      - main_business_countries
      - estimated_annual_revenue
      title: SolePropBusinessDetails
      type: object
    SolePropSourceOfFunds:
      description: 'Sole Prop Source of Funds Section

        '
      properties:
        source_of_funds:
          $ref: '#/components/schemas/RevenueSource'
      required:
      - source_of_funds
      title: SolePropSourceOfFunds
      type: object
    IdentificationBusinessParams:
      description: 'Business Identification Params


        The params required to create an identification

        '
      properties:
        company_data:
          $ref: '#/components/schemas/CompanyData'
        ip_address:
          description: The IP address of the device used to submit the identification
          type: string
        phone:
          description: The phone number of the company
          type: string
        questionnaire:
          $ref: '#/components/schemas/BusinessQuestionnaire'
      required:
      - company_data
      - phone
      - ip_address
      - questionnaire
      title: IdentificationBusinessParams
      type: object
    IdentificationCreateParamsV2_IdentificationBusinessParams:
      allOf:
      - properties:
          type:
            enum:
            - Business
            example: Business
            type: string
        required:
        - type
        type: object
      - $ref: '#/components/schemas/IdentificationBusinessParams'
      description: 'Identification Create Params V2


        The params required to create an identification v2, we support three types of identification:

        - Link: where a link is provided to the customer for access to the identification process.

        - Token: where a token is provided in the request from which verification data can be extracted and where the token is generated by the third party provider

        - Person: where the identification details of the person for which the identification process is being created are provided in the request

        '
    Identification:
      description: 'Identification


        The entity wrapping our KYC/KYB process and underlying providers

        '
      properties:
        created_at:
          format: date-time
          type: string
        customer_id:
          description: Absent on a referral partner's identification (partner-keyed record)
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        partner_id:
          description: The owning partner for partner-keyed (referral) records
          format: uuid
          type: string
        residence_country:
          description: 'ISO 3166-1 alpha-2 (2 letter) country code of the verified residence

            address; only set on the customer''s most recent identification while it

            is approved'
          type: string
        review_comment:
          type: string
        status:
          $ref: '#/components/schemas/IdentificationStatus'
        step_status:
          $ref: '#/components/schemas/IdentificationStepStatus'
        updated_at:
          format: date-time
          type: string
        url:
          type: string
        with_edd:
          type: boolean
      required:
      - id
      - status
      - created_at
      - updated_at
      title: Identification
      type: object
    SigningCreateParams:
      description: Params for Creating a Signing
      example:
        content_id: 019f846a-8d21-7813-8e60-80211898ca9f
        signed: true
      properties:
        content_id:
          description: unique UUID of the content signed by Customer
          format: uuid
          type: string
        signed:
          description: Explicit signing consent
          type: boolean
      required:
      - signed
      title: SigningCreateParams
      type: object
    RejectReason:
      description: 'A Sumsub rejection reason: the stable code paired with a human-readable

        description, so partners can display the reason without maintaining their

        own code→text mapping.'
      properties:
        code:
          description: Stable Sumsub reject-label code, e.g. `UNSATISFACTORY_PHOTOS`.
          type: string
        description:
          description: Human-readable description of the code.
          type: string
      required:
      - code
      - description
      title: RejectReason
      type: object
    PersonProfileSourceOfWealth:
      description: 'Source of Wealth


        The source of wealth of the person

        '
      enum:
      - Salary
      - Savings
      - Investments
      - CryptoTrading
      - Other
      type: string
    CustomerStatus:
      description: 'The status of the Customer

        '
      enum:
      - UserRequired
      - SigningsRequired
      - IdentificationRequired
      - Active
      - Suspended
      - Archived
      type: string
    AuthenticationCode:
      description: 'An authentication code


        used to confirm a 2FA action

        '
      properties:
        attempts:
          description: attempts to submit the authentication code
          format: int32
          type: integer
        entity_id:
          description: the ID of the entity the authentication is related to
          format: uuid
          type: string
        expires_at:
          description: the time of expiry for the authentication code
          format: date-time
          type: string
        id:
          description: The ID of the authentication code
          format: uuid
          type: string
        status:
          $ref: '#/components/schemas/AuthenticationCodeStatus'
      required:
      - id
      - status
      - expires_at
      - attempts
      - entity_id
      title: AuthenticationCode
      type: object
    BusinessQuestionnaireBusinessDetails:
      description: 'Business Details Section


        Industry classification and operational information about the company

        '
      properties:
        business_model_description:
          description: Description of business model and target clients
          type: string
        estimated_annual_revenue:
          $ref: '#/components/schemas/BusinessEstimatedAnnualRevenue'
        has_licenses_or_registrations:
          description: Does the company maintain any licenses or registrations
          type: boolean
        industry_type:
          $ref: '#/components/schemas/BusinessIndustryType'
        main_business_countries:
          description: Main countries of business operation (ISO 3166-1 alpha-2 codes)
          items:
            type: string
          type: array
        requires_aml_program:
          description: Is the company required to have an AML/CFT compliance program
          type: boolean
      required:
      - industry_type
      - business_model_description
      - main_business_countries
      - has_licenses_or_registrations
      - requires_aml_program
      - estimated_annual_revenue
      title: BusinessQuestionnaireBusinessDetails
      type: object
    Occupation:
      description: 'Occupation


        The occupation of the person

        '
      enum:
      - Agriculture
      - ArtsAndEntertainment
      - Construction
      - Education
      - FinancialServices
      - InformationAndTechnology
      - Retail
      - RealEstate
      - Other
      - BusinessOwner
      - Healthcare
      - Industrial
      - LegalServices
      - PublicSector
      - SeniorManagement
      type: string
    Signing:
      description: 'Signing


        A signing of a document by a customer

        '
      properties:
        content_id:
          description: unique UUID of the content signed by Customer
          format: uuid
          type: string
        created_at:
          description: created_at timestamp of Signing
          format: date-time
          type: string
        customer_id:
          description: unique UUID of the Customer who signed
          format: uuid
          type: string
        document_id:
          description: unique UUID of the Document signed by Customer (Soon to be deprecated, use content_id & content_type instead)
          format: uuid
          type: string
        id:
          description: unique UUID of Signing
          format: uuid
          type: string
        updated_at:
          description: updated_at timestamp of Signing
          format: date-time
          type: string
      required:
      - id
      - customer_id
      - created_at
      - updated_at
      title: Signing
      type: object
    GenericBusinessQuestionnaire:
      description: 'KYB compliance questionnaire for standard company types

        '
      properties:
        business_details:
          $ref: '#/components/schemas/BusinessQuestionnaireBusinessDetails'
        planned_activities:
          $ref: '#/components/schemas/BusinessQuestionnairePlannedActivities'
        source_of_funds:
          $ref: '#/components/schemas/BusinessQuestionnaireSourceOfFunds'
      required:
      - planned_activities
      - source_of_funds
      - business_details
      title: GenericBusinessQuestionnaire
      type: object
    BusinessBeneficiaryInfo:
      description: 'Business Beneficiary Info


        A company that itself owns or controls the parent business. Carries the

        same `ApiCompanyData` as the root identification: company info, its own

        beneficiaries (which may include further nested businesses up to the

        configured depth limit), and supporting documents.

        '
      properties:
        company_data:
          $ref: '#/components/schemas/CompanyData'
      required:
      - company_data
      title: BusinessBeneficiaryInfo
      type: object
    CustomerType:
      description: 'CustomerType


        Customers can either be a commercial business or a natural person

        '
      enum:
      - Business
      - Person
      type: string
    BeneficiaryIdentity:
      description: 'Beneficiary Identity Document


        Identity document and biometric information for a person beneficiary.

        Mirrors ApiPersonIdentity but excludes ip_address (collected at the business level).

        '
      properties:
        identity_country_code:
          description: ISO 3166-1 alpha-2 country code of the person's identity document
          type: string
        identity_document_back:
          description: Base64 encoded image of identity document back (10MB max)
          type: string
        identity_document_front:
          description: Base64 encoded image of identity document front (10MB max)
          type: string
        identity_document_type:
          $ref: '#/components/schemas/IdentityDocumentType'
        identity_number:
          description: The identity number of the document being submitted
          type: string
        nationality:
          description: ISO 3166-1 alpha-2 nationality country code
          type: string
        selfie:
          description: 'Base64 encoded selfie image (10MB max).

            Required for beneficiaries with Director or Representative roles; omit for UBO-only.'
          type: string
        selfie_collected_at:
          description: 'timestamp in ISO 8601 format when the selfie was captured.

            Required when selfie is provided.'
          type: string
      required:
      - identity_country_code
      - identity_document_type
      - identity_document_front
      - nationality
      title: BeneficiaryIdentity
      type: object
    EddQuestionnaire:
      description: 'EDD Questionnaire


        The questionnaire for a reliance person residing in a country considered high risk

        '
      properties:
        approximate_net_worth:
          $ref: '#/components/schemas/ApproximateNetWorth'
        occupation:
          $ref: '#/components/schemas/Occupation'
        source_of_funds_proof:
          description: 'Source of funds proof document, provided as a base64-encoded string.

            Supported formats: jpg, png, pdf, doc, docx, xls, xlsx, odt, ods, txt.

            Maximum size: 10MB'
          type: string
      required:
      - occupation
      - approximate_net_worth
      - source_of_funds_proof
      title: EddQuestionnaire
      type: object
    Crypto:
      description: A cryptocurrency
      example:
        blockchain: Solana
        token: USDC
      properties:
        blockchain:
          $ref: '#/components/schemas/Blockchain'
        token:
          description: The ticker of the token e.g. 'USDC'
          type: string
      required:
      - token
      - blockchain
      title: Crypto
      type: object
    Currency:
      anyOf:
      - $ref: '#/components/schemas/Currency_Crypto'
      - $ref: '#/components/schemas/Currency_Fiat'
      description: 'Currency


        Can be either crypto or fiat

        '
      discriminator:
