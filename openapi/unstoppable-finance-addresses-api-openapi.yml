      type: object
    VerifiedAddressResponse:
      description: 'Verified Address Response


        Response containing verified address details

        '
      example:
        address_type: SelfHosted
        blockchain: Solana
        created_at: 2024-01-15 10:30:00+00:00
        disabled: false
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        is_self: true
        name: Primary Solana wallet
        proof_message: I hereby verify that I own this wallet address
        proof_signature: 5J9qvKhKqYbpjhCkqDnKXSp7QqLDBU5iT4VWshsqRdWKHjKdqZqKqYbpjhCkqDnKXSp...
        vasp_did: null
        wallet_address: 7QqLDBU5iT4VWshsqRdWKHjKdqZqKqYbpjhCkqDnKXSp
      properties:
        address_type:
          $ref: '#/components/schemas/AddressType'
        blockchain:
          $ref: '#/components/schemas/Blockchain'
        created_at:
          description: When the address was verified
          format: date-time
          type: string
        disabled:
          description: Whether the address is disabled
          type: boolean
        id:
          description: The ID of the verified address
          format: uuid
          type: string
        is_self:
          description: Whether the wallet belongs to the customer themselves (true) or a third party
          type: boolean
        name:
          description: Optional display name for this wallet address
          type: string
        proof_message:
          description: The proof message
          type: string
        proof_signature:
          description: The proof signature
          type: string
        vasp_did:
          description: The VASP DID (decentralized Identifier) for hosted wallets
          type: string
        wallet_address:
          description: The wallet address
          type: string
      required:
      - id
      - created_at
      - wallet_address
      - address_type
      - blockchain
      - disabled
      - is_self
      title: VerifiedAddressResponse
      type: object
    SelfHostedWalletResponse:
      description: 'Self-Hosted Wallet Response


        Response containing self-hosted wallet details

        '
      properties:
        address:
          description: The address that was proven
          type: string
        created_at:
          description: When the wallet was registered
          format: date-time
          type: string
        customer_id:
          description: The customer ID
          type: string
        disabled:
          description: Whether the address is disabled
          type: boolean
        id:
          description: The ID of the self-hosted wallet
          type: string
        name:
          description: Optional display name for this wallet address
          type: string
        signature:
          description: The signature that was submitted
          type: string
      required:
      - id
      - address
      - signature
      - created_at
      - customer_id
      - disabled
      title: SelfHostedWalletResponse
      type: object
    PixBankDetails:
      description: 'PixBankDetails


        Full Brazilian bank account details identifying the recipient''s account,

        for recipients without a registered PIX key.'
      example:
        account_number: '5678901'
        account_type: CHECKING
        bank_code: '341'
        branch_code: '1234'
      properties:
        account_number:
          description: 'Account number including the verification (check) digit, with no

            separator, e.g. `7140025418`.'
          maxLength: 20
          minLength: 1
          type: string
        account_type:
          $ref: '#/components/schemas/PixAccountType'
        bank_code:
          description: 3-digit COMPE bank code or 8-digit ISPB, distinguished by length
          pattern: ^([0-9]{3}|[0-9]{8})$
